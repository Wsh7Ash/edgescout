[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "edgescout"
version = "1.0.0"
description = "50 validated edge and web-cache security skills plus an edge-plan CLI for authorized assessment."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Wsh7Ash" }]
keywords = ["web-cache", "cdn", "agent-skills", "security", "cache-poisoning"]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
edgescout = "edgescout.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"